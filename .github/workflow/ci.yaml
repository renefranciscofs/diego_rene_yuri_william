name: Integração Contínua (CI)

on:
  push:
  pull_request: 

jobs:
  pytest:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v7

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Instalar dependências
        run:  |
          pip install -r requirements.txt

      - name: Configurar ambiente de testes
        run: |
          echo "JWT_SECRET_KEY=$(python -c 'import secrets; print(secrets.token_hex(32))')" > .env
          echo "JWT_EXPIRE_MINUTES=30" >> .env
          echo "ALLOWED_ORIGINS=http://localhost:3000" >> .env
          echo "AUTH_RATE_LIMIT_MAX_ATTEMPTS=5" >> .env
          echo "AUTH_RATE_LIMIT_WINDOW_SECONDS=60" >> .env
          
      - name: Executar testes
        working-directory:  .
        env:
          PYTHONPATH: .
        run: pytest tests/ -v