name: Integração Contínua (CI)

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v7

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # As dependências da API e dos testes (fastapi, pytest, httpx, pyjwt,
      # passlib) ficam em fastapi/requirements.txt; o requirements.txt da
      # raiz é só do notebook.
      - name: Instalar dependências
        run: |
          pip install -r fastapi/requirements.txt

      # Não é preciso .env: tests/conftest.py define JWT_SECRET_KEY e os
      # limites de rate limit antes de importar a API.
      - name: Executar testes
        run: pytest tests/ -v
